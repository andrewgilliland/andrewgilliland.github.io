version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      # @vitest/coverage-v8 pins vitest to its exact version, so a lone bump
      # of either fails to install. Update them in one PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # react-dom requires the exact same react version, so a lone bump of
      # either fails to install. Keep the React stack in one PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@astrojs/react"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 10
